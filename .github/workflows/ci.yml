name: CI

on:
  push:
    branches: [develop, release, master, 'feature/**', 'hotfix/**']
  pull_request:
    branches: [develop, release, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build e testes (Java 25)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build, testes e cobertura mínima (JaCoCo)
        run: ./mvnw -B -ntp verify

      - name: Resumo da cobertura
        if: always()
        run: |
          for csv in $(find . -path '*/site/jacoco/jacoco.csv'); do
            awk -F, -v f="$csv" 'NR>1{m+=$8;c+=$9}END{if(m+c>0) printf "| %s | %.1f%% |\n", f, 100*c/(m+c)}' "$csv"
          done > coverage.md
          { echo "### Cobertura de linhas"; echo "| Relatório | Cobertura |"; echo "|---|---|"; cat coverage.md; } >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: '**/target/site/jacoco/'
          if-no-files-found: ignore
