services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: hub
      POSTGRES_USER: hub
      POSTGRES_PASSWORD: hub
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hub"]
      interval: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    ports:
      - "15672:15672" # painel do RabbitMQ (guest/guest)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      retries: 10

  hub:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/hub
      RABBIT_HOST: rabbitmq
      # Para conectar ao Mercado Livre de verdade:
      # ML_ACCESS_TOKEN: ${ML_ACCESS_TOKEN}
      # ML_SELLER_ID: ${ML_SELLER_ID}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
